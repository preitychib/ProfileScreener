# Chat: Groq | Embeddings: OpenAI (no Ollama required)
langchain4j.open-ai.chat-model.api-key=${GROQ_API_KEY}
langchain4j.open-ai.chat-model.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
langchain4j.open-ai.chat-model.model-name=${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
langchain4j.open-ai.chat-model.temperature=${GROQ_TEMPERATURE:0.2}
langchain4j.open-ai.chat-model.timeout=${GROQ_TIMEOUT:PT60S}

langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.embedding-model.model-name=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

langchain4j.community.redis.dimension=1536
