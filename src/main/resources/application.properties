spring.application.name=resume-rag-demo
server.port=8083

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:recruiter;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# OpenAI
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.embedding-model.model-name=text-embedding-3-small

# Redis Stack vector store
langchain4j.community.redis.host=localhost
langchain4j.community.redis.port=6379
langchain4j.community.redis.index-name=resume-embeddings
langchain4j.community.redis.dimension=1536
langchain4j.community.redis.metadata-keys=candidateId,fileName,candidateName,profile

# App config
app.resumes.directory=resumes
