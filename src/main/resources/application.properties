spring.application.name=resume-rag-demo
server.port=8083

# Chat + embedding are separate concerns. Pick one profile:
#   ollama | openai | groq-cloud-embedding | groq-local-embedding
#   LLM_PROVIDER=openai mvn spring-boot:run
spring.profiles.active=${LLM_PROVIDER:ollama}

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:recruiter;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Redis Stack vector store (dimension is profile-specific)
langchain4j.community.redis.host=${REDIS_HOST:localhost}
langchain4j.community.redis.port=${REDIS_PORT:6379}
langchain4j.community.redis.index-name=resume-embeddings
langchain4j.community.redis.metadata-keys=candidateId,fileName,candidateName,profile

# App config
app.resumes.directory=resumes
